<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coaching Room">
<meta name="description" content="Joe's coaching app: game model, tactics board, sessions, match plans and reviews.">
<title>The Coaching Room</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/supabase.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="app" id="app">
  <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="view" tabindex="-1"><p class="muted" style="padding:40px 0;text-align:center">Loading…</p></main>
  </div>
</div>
<div class="chaldock" id="chalDock" hidden aria-label="Coach’s challenge"></div>
<nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>
<div id="print"></div>
<noscript><p style="padding:20px;color:#fff">The Coaching Room needs JavaScript switched on.</p></noscript>
</body>
</html>
