<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coaching Room">
<meta name="description" content="Coaching app: game model, tactics board, sessions, match plans and reviews.">
<title>The Coaching Room</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/supabase.js" defer></script>
<script>
// Opened by double-clicking the file (file://)? Browsers refuse to load the app's modules from a file path, so say so instead of hanging on "Loading…".
if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('view').innerHTML = '<div style="max-width:560px;margin:40px auto;padding:20px;border:1px solid rgba(255,255,255,.15);border-radius:16px;color:#EEF2FA;font:15px/1.5 system-ui,sans-serif"><b style="font-size:18px">This app needs a web address</b><p>You have opened index.html as a file. Browsers will not run the app that way.</p><p>Either finish steps 1 and 2 in README.md (GitHub Pages) and open the address it gives you, or for a quick look on this PC open a command prompt in this folder and run:</p><pre style="background:rgba(0,0,0,.35);padding:10px;border-radius:8px;overflow:auto">python -m http.server 8765</pre><p>then open <b>http://localhost:8765/index.html</b></p></div>';
});
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<div class="app" id="app">
  <nav class="sidebar" id="sidebar" aria-label="Main"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="view" tabindex="-1"><p class="muted" style="padding:40px 0;text-align:center">Loading…</p></main>
  </div>
</div>
<div class="chaldock" id="chalDock" hidden aria-label="Coach’s challenge"></div>
<nav class="bottomnav" id="bottomnav" aria-label="Main"></nav>
<div id="print"></div>
<noscript><p style="padding:20px;color:#fff">The Coaching Room needs JavaScript switched on.</p></noscript>
</body>
</html>
